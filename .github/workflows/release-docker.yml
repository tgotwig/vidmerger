name: 🐳 Release on Docker
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example 0.4.2"
        required: true
        type: string
    secrets:
      VIDMERGER_DOCKERHUB_SECRET:
        description: "Docker Hub access token for pushing the image"
        required: true
permissions:
  contents: read
jobs:
  manifest:
    name: 🐳 Publish multi-arch Docker manifest
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          # https://app.docker.com/accounts/tgotwig/settings/personal-access-tokens
          DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
        with:
          username: tgotwig
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: Create manifest from amd64 and arm64 images
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$REPO:latest" \
            --tag "$REPO:$TAG" \
            "$REPO:$TAG-amd64" \
            "$REPO:$TAG-arm64"
