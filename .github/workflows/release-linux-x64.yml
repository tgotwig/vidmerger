name: 🐧 Release on Linux x64
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example 0.4.2"
        required: true
        type: string
    secrets:
      VIDMERGER_TAPS_SECRET:
        description: "Token that can push to the Homebrew tap"
        required: true
      VIDMERGER_DOCKERHUB_SECRET:
        description: "Docker Hub access token for pushing the image"
        required: true
    outputs:
      version:
        description: "Version from the tag"
        value: ${{ jobs.build.outputs.version }}
      sha:
        description: "SHA-256 of the published Linux amd64 archive"
        value: ${{ jobs.build.outputs.sha }}
permissions:
  contents: write
jobs:
  build:
    name: 🐧 Build and upload Linux x64 asset
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha: ${{ steps.shasum.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: 🧑‍🔧 Build Release
        run: cargo build --release && tar -C target/release -czf target/release/vidmerger-linux.tar.gz vidmerger

      - name: ⬆️ Get version
        id: get_version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          asset=vidmerger-linux.tar.gz
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$asset already on release, reusing it"
          else
            gh release upload "$TAG" "target/release/$asset"
          fi

      - name: 🧮 Set SHA
        id: shasum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Hash the asset as published, so reused and new uploads give the same checksum
          dir="$RUNNER_TEMP/published-linux"
          mkdir -p "$dir"
          gh release download "$TAG" --pattern vidmerger-linux.tar.gz --dir "$dir" --clobber
          echo "sha=$(sha256sum "$dir/vidmerger-linux.tar.gz" | awk '{printf $1}')" >> "$GITHUB_OUTPUT"

      - name: 🏝 Set git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Install Linuxbrew
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)" < /dev/null

      - name: 🍺 Bump Brew
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.VIDMERGER_TAPS_SECRET }}
          VERSION: ${{ steps.get_version.outputs.version }}
          SHA: ${{ steps.shasum.outputs.sha }}
        run: |
          brew=/home/linuxbrew/.linuxbrew/bin/brew
          $brew tap tgotwig/homebrew-linux-vidmerger
          # Skip when master or this version's bump branch (open PR) already has this sha256
          branch="bump-vidmerger-$VERSION"
          already=""
          for ref in master "$branch"; do
            f="$RUNNER_TEMP/formula-$ref.rb"
            if curl -fsSL -o "$f" "https://raw.githubusercontent.com/tgotwig/homebrew-linux-vidmerger/$ref/vidmerger.rb" && grep -q "$SHA" "$f"; then
              already=1
            fi
          done
          if [ -n "$already" ]; then
            echo "Formula already has this release's sha256 (master or $branch), skipping bump"
            exit 0
          fi
          $brew trust --formula tgotwig/homebrew-linux-vidmerger/vidmerger
          $brew bump-formula-pr -f --version="$VERSION" --no-browse --no-audit \
          --sha256="$SHA" \
          --url="https://github.com/tgotwig/vidmerger/releases/download/$VERSION/vidmerger-linux.tar.gz" \
          tgotwig/homebrew-linux-vidmerger/vidmerger

  docker:
    name: 🐳 Publish on Docker Hub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ⬇️ Download Linux x64 asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          dir="$RUNNER_TEMP/docker"
          mkdir -p "$dir"
          gh release download "$TAG" --pattern vidmerger-linux.tar.gz --dir "$dir" --clobber
          tar -C "$dir" -xzf "$dir/vidmerger-linux.tar.gz"
          rm "$dir/vidmerger-linux.tar.gz"

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          # https://app.docker.com/accounts/tgotwig/settings/personal-access-tokens
          DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
        with:
          username: tgotwig
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: 🐳 Build and push amd64 image
        env:
          IMAGE: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          rc=0
          sh script/docker-image-exists.sh "$IMAGE:$TAG-amd64" || rc=$?
          if [ "$rc" = 0 ]; then
            echo "$IMAGE:$TAG-amd64 is already on Docker Hub, skipping build and push"
            exit 0
          fi
          [ "$rc" = 1 ] || exit 1
          docker build -f docker/Dockerfile -t "$IMAGE:$TAG-amd64" "$RUNNER_TEMP/docker"
          docker push "$IMAGE:$TAG-amd64"

      - name: 🏷️ Create multi-arch tags
        env:
          IMAGE: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Both Linux workflows run this step, the one that pushes last sees both arch images
          rc=0
          sh script/docker-image-exists.sh "$IMAGE:$TAG-arm64" || rc=$?
          if [ "$rc" = 1 ]; then
            echo "$IMAGE:$TAG-arm64 is not on Docker Hub yet, the other Linux workflow creates the tags"
            exit 0
          fi
          [ "$rc" = 0 ] || exit 1
          # Skip when the tag exists, so re-running an old release does not move latest back
          rc=0
          sh script/docker-image-exists.sh "$IMAGE:$TAG" || rc=$?
          if [ "$rc" = 0 ]; then
            echo "$IMAGE:$TAG is already on Docker Hub, skipping tags"
            exit 0
          fi
          [ "$rc" = 1 ] || exit 1
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
