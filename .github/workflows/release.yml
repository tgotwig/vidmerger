name: 🎉 Release
on:
  push:
    tags:
      - "*"
permissions:
  contents: write

jobs:
  prepare:
    name: 👷 Prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🐣 Create Release folder on Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release notes are the lines between "## [Unreleased]" and the next "## " heading in CHANGELOG.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping creation"
            exit 0
          fi
          sed -n '/^## \[Unreleased\]/,/^## /{/^## /!p;}' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "No release notes found under [Unreleased] in CHANGELOG.md" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release_notes.md"

  release-osx:
    name: 🍎 Release on MacOS
    runs-on: macos-latest
    needs: prepare
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha: ${{ steps.shasum.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: 🧑‍🔧 Build Release
        run: cargo build --release && tar -C target/release -czf target/release/vidmerger-mac.tar.gz vidmerger

      - name: ⬆️ Get version
        id: get_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - name: 🧮 Set SHA
        id: shasum
        run: |
          echo "sha=$(shasum -a 256 target/release/vidmerger-mac.tar.gz | awk '{printf $1}')" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=vidmerger-mac.tar.gz
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$asset already on release, reusing it"
          else
            gh release upload "$GITHUB_REF_NAME" "target/release/$asset"
          fi

  release-linux:
    name: 🐧 Release on Linux
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha: ${{ steps.shasum.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: 🧑‍🔧 Build Release
        run: cargo build --release && tar -C target/release -czf target/release/vidmerger-linux.tar.gz vidmerger

      - name: ⬇️ Install arm64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: 🧑‍🔧 Build Release arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          tar -C target/aarch64-unknown-linux-gnu/release -czf target/aarch64-unknown-linux-gnu/release/vidmerger-linux-arm64.tar.gz vidmerger

      - name: 🚀 Upload arm64 Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=vidmerger-linux-arm64.tar.gz
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$asset already on release, reusing it"
          else
            gh release upload "$GITHUB_REF_NAME" "target/aarch64-unknown-linux-gnu/release/$asset"
          fi

      - name: ⬆️ Get version
        id: get_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - name: 🧮 Set SHA
        id: shasum
        run: |
          echo "sha=$(shasum -a 256 target/release/vidmerger-linux.tar.gz | awk '{printf $1}')" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=vidmerger-linux.tar.gz
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$asset already on release, reusing it"
          else
            gh release upload "$GITHUB_REF_NAME" "target/release/$asset"
          fi

  publish:
    name: 🌍 Publish release
    runs-on: ubuntu-latest
    needs: [release-osx, release-linux, release-windows-chocolatey]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: 🚀 Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: 🍺 Bump Brew (macOS)
        env:
          # https://github.com/settings/tokens
          TAPS_SECRET: ${{ secrets.VIDMERGER_TAPS_SECRET }}
          VERSION: ${{ needs.release-osx.outputs.version }}
          SHA: ${{ needs.release-osx.outputs.sha }}
        run: |
          tap=submodules/homebrew-vidmerger
          tap_url="https://x-access-token:${TAPS_SECRET}@github.com/tgotwig/homebrew-vidmerger.git"
          git -C "$tap" fetch -q "$tap_url" master
          git -C "$tap" checkout -q -B master FETCH_HEAD
          formula="$tap/vidmerger.rb"
          if grep -q "$SHA" "$formula"; then
            echo "Formula already has this release's sha256, skipping bump"
            exit 0
          fi
          sed -i.bak \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" \
            -e "s|releases/download/[^/]*/vidmerger-mac.tar.gz|releases/download/$VERSION/vidmerger-mac.tar.gz|" \
            "$formula"
          rm -f "$formula.bak"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add vidmerger.rb
          git -C "$tap" commit -m "vidmerger $VERSION"
          git -C "$tap" push "$tap_url" HEAD:master

      - name: 🍺 Bump Brew (Linux)
        env:
          # https://github.com/settings/tokens
          TAPS_SECRET: ${{ secrets.VIDMERGER_TAPS_SECRET }}
          VERSION: ${{ needs.release-linux.outputs.version }}
          SHA: ${{ needs.release-linux.outputs.sha }}
        run: |
          tap=submodules/homebrew-linux-vidmerger
          tap_url="https://x-access-token:${TAPS_SECRET}@github.com/tgotwig/homebrew-linux-vidmerger.git"
          git -C "$tap" fetch -q "$tap_url" master
          git -C "$tap" checkout -q -B master FETCH_HEAD
          formula="$tap/vidmerger.rb"
          if grep -q "$SHA" "$formula"; then
            echo "Formula already has this release's sha256, skipping bump"
            exit 0
          fi
          sed -i.bak \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" \
            -e "s|releases/download/[^/]*/vidmerger-linux.tar.gz|releases/download/$VERSION/vidmerger-linux.tar.gz|" \
            "$formula"
          rm -f "$formula.bak"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add vidmerger.rb
          git -C "$tap" commit -m "vidmerger $VERSION"
          git -C "$tap" push "$tap_url" HEAD:master

  release-windows-chocolatey:
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get version
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build and package binary
        run: |
          cargo build --release
          mkdir tools
          mv target\release\vidmerger.exe tools
      - name: 🚀 Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=vidmerger.exe
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$asset already on release, reusing it"
          else
            gh release upload "$GITHUB_REF_NAME" "tools/$asset"
          fi
      - name: Create nuspec, LICENSE and VERIFICATION files
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          cat > vidmerger.nuspec <<'EOF'
          <?xml version="1.0"?>
          <package>
            <metadata>
              <id>vidmerger</id>
              <version>${VERSION}</version>
              <title>vidmerger</title>
              <authors>Thomas Gotwig</authors>
              <projectUrl>https://github.com/tgotwig/vidmerger</projectUrl>
              <description>Vidmerger is a command-line-tool which uses `ffmpeg` to merge multiple video-files with the same file-extension together into one file called `output.FORMAT`. It includes a usage help which you can print out by `vidmerger --help` 😃</description>
              <tags>video cli rust</tags>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          EOF
          nuspec=$(cat vidmerger.nuspec)
          printf '%s\n' "${nuspec//\$\{VERSION\}/$VERSION}" > vidmerger.nuspec
          cat > tools/LICENSE.txt <<'EOF'
          Copyright 2023 Thomas Gotwig

          Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
          EOF
          {
            echo 'Generated by `CertUtil -hashfile vidmerger.exe SHA256`:'
            echo
            CertUtil -hashfile tools/vidmerger.exe SHA256
            echo
          } > tools/VERIFICATION.txt
      - name: Create chocolatey package
        run: choco pack vidmerger.nuspec
      - name: Publish on chocolatey
        shell: bash
        env:
          # https://community.chocolatey.org/account
          CHOCO_SECRET: ${{ secrets.VIDMERGER_CHOCO_SECRET }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          version="$VERSION"
          if curl -fsSL -o /dev/null "https://community.chocolatey.org/api/v2/Packages(Id='vidmerger',Version='${version}')"; then
            echo "vidmerger ${version} is already published on Chocolatey, skipping push"
            exit 0
          fi
          choco push "vidmerger.${version}.nupkg" -s https://push.chocolatey.org/ --api-key="$CHOCO_SECRET"

  release-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          # https://app.docker.com/accounts/tgotwig/settings/personal-access-tokens
          DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
        with:
          username: tgotwig
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ github.repository }}:latest
            ${{ github.repository }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=registry,create-index=true
