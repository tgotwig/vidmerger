name: 🎉 Release
on:
  push:
    tags:
      - "*"
permissions:
  contents: write

jobs:
  prepare:
    name: 👷 Prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🐣 Create Release folder on Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release notes are the lines between "## [Unreleased]" and the next "## " heading in CHANGELOG.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping creation"
            exit 0
          fi
          sed -n '/^## \[Unreleased\]/,/^## /{/^## /!p;}' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "No release notes found under [Unreleased] in CHANGELOG.md" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release_notes.md"

  release-docker:
    name: 🐳 Release on Docker
    needs: prepare
    uses: ./.github/workflows/release-docker.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}

  release-linux:
    name: 🐧 Release on Linux
    needs: prepare
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ github.ref_name }}

  release-macos:
    name: 🍎 Release on MacOS
    needs: prepare
    uses: ./.github/workflows/release-macos.yml
    with:
      tag: ${{ github.ref_name }}

  release-windows:
    name: 🏳️ Release on Windows and Chocolatey
    needs: prepare
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_CHOCO_SECRET: ${{ secrets.VIDMERGER_CHOCO_SECRET }}
