name: 🎉 Release
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
jobs:
  prepare:
    name: 👷 Prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🐣 Create Release folder on Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release notes are the lines between "## [Unreleased]" and the next "## " heading in CHANGELOG.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping creation"
            exit 0
          fi
          sed -n '/^## \[Unreleased\]/,/^## /{/^## /!p;}' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "No release notes found under [Unreleased] in CHANGELOG.md" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release_notes.md"

  release-linux-arm:
    name: 🐧 Release on Linux arm64
    needs: prepare
    uses: ./.github/workflows/release-linux-arm.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
  release-linux-x64:
    name: 🐧 Release on Linux x64
    needs: prepare
    uses: ./.github/workflows/release-linux-x64.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_TAPS_SECRET: ${{ secrets.VIDMERGER_TAPS_SECRET }}
      VIDMERGER_DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}

  release-macos:
    name: 🍎 Release on MacOS
    needs: prepare
    uses: ./.github/workflows/release-macos.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_TAPS_SECRET: ${{ secrets.VIDMERGER_TAPS_SECRET }}

  release-windows-arm:
    name: 🏳️ Release on Windows arm64
    needs: prepare
    uses: ./.github/workflows/release-windows-arm.yml
    with:
      tag: ${{ github.ref_name }}
  release-windows-x64:
    name: 🏳️ Release on Windows x64 and Chocolatey
    needs: prepare
    uses: ./.github/workflows/release-windows-x64.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_CHOCO_SECRET: ${{ secrets.VIDMERGER_CHOCO_SECRET }}

  release-docker:
    name: 🐳 Publish multi-arch Docker manifest
    needs: [release-linux-x64, release-linux-arm]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          # https://app.docker.com/accounts/tgotwig/settings/personal-access-tokens
          DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
        with:
          username: tgotwig
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: Create manifest from amd64 and arm64 images
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$REPO:latest" \
            --tag "$REPO:$TAG" \
            "$REPO:$TAG-amd64" \
            "$REPO:$TAG-arm64"
