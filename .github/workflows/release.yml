name: 🎉 Release
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
jobs:
  prepare:
    name: 👷 Prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🐣 Create Release folder on Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping creation"
            exit 0
          fi
          # Release notes are the lines between "## ... [<tag>]" and the next "## " heading in CHANGELOG.md,
          # or between "## [Unreleased]" and the next "## " heading when the tag has no section yet
          tag_re=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[.]/\\./g')
          sed -n "/^## .*\[$tag_re\]/,/^## /{/^## /!p;}" CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            sed -n '/^## \[Unreleased\]/,/^## /{/^## /!p;}' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "No release notes found under [$GITHUB_REF_NAME] or [Unreleased] in CHANGELOG.md" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release_notes.md"

  release-linux-arm:
    name: 🐧 Release on Linux arm64 and Docker Hub
    needs: prepare
    uses: ./.github/workflows/release-linux-arm.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
  release-linux-x64:
    name: 🐧 Release on Linux x64 and Docker Hub
    needs: prepare
    uses: ./.github/workflows/release-linux-x64.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_TAPS_SECRET: ${{ secrets.VIDMERGER_TAPS_SECRET }}
      VIDMERGER_DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}

  release-macos:
    name: 🍎 Release on MacOS
    needs: prepare
    uses: ./.github/workflows/release-macos.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_TAPS_SECRET: ${{ secrets.VIDMERGER_TAPS_SECRET }}

  release-windows-arm:
    name: 🏳️ Release on Windows arm64
    needs: prepare
    uses: ./.github/workflows/release-windows-arm.yml
    with:
      tag: ${{ github.ref_name }}
  release-windows-x64:
    name: 🏳️ Release on Windows x64 and Chocolatey
    needs: prepare
    uses: ./.github/workflows/release-windows-x64.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIDMERGER_CHOCO_SECRET: ${{ secrets.VIDMERGER_CHOCO_SECRET }}
