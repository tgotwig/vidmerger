name: 🐧 Release on Linux arm64
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example 0.4.2"
        required: true
        type: string
    secrets:
      VIDMERGER_DOCKERHUB_SECRET:
        description: "Docker Hub access token for pushing the image"
        required: true
permissions:
  contents: write
jobs:
  build:
    name: 🐧 Build and upload Linux arm64 asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: ⬇️ Install arm64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu

      - name: 🧑‍🔧 Build Release arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          tar -C target/aarch64-unknown-linux-gnu/release -czf target/aarch64-unknown-linux-gnu/release/vidmerger-linux-arm64.tar.gz vidmerger

      - name: 🚀 Upload arm64 Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          asset=vidmerger-linux-arm64.tar.gz
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$asset already on release, reusing it"
          else
            gh release upload "$TAG" "target/aarch64-unknown-linux-gnu/release/$asset"
          fi

  docker:
    name: 🐳 Publish on Docker Hub
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ⬇️ Download Linux arm64 asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          dir="$RUNNER_TEMP/docker"
          mkdir -p "$dir"
          gh release download "$TAG" --pattern vidmerger-linux-arm64.tar.gz --dir "$dir" --clobber
          tar -C "$dir" -xzf "$dir/vidmerger-linux-arm64.tar.gz"
          rm "$dir/vidmerger-linux-arm64.tar.gz"

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          # https://app.docker.com/accounts/tgotwig/settings/personal-access-tokens
          DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
        with:
          username: tgotwig
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: 🐳 Build and push arm64 image
        env:
          IMAGE: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          rc=0
          sh script/docker-image-exists.sh "$IMAGE:$TAG-arm64" || rc=$?
          if [ "$rc" = 0 ]; then
            echo "$IMAGE:$TAG-arm64 is already on Docker Hub, skipping build and push"
            exit 0
          fi
          [ "$rc" = 1 ] || exit 1
          docker build -f docker/Dockerfile -t "$IMAGE:$TAG-arm64" "$RUNNER_TEMP/docker"
          docker push "$IMAGE:$TAG-arm64"

      - name: 🏷️ Create multi-arch tags
        env:
          IMAGE: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Both Linux workflows run this step, the one that pushes last sees both arch images
          rc=0
          sh script/docker-image-exists.sh "$IMAGE:$TAG-amd64" || rc=$?
          if [ "$rc" = 1 ]; then
            echo "$IMAGE:$TAG-amd64 is not on Docker Hub yet, the other Linux workflow creates the tags"
            exit 0
          fi
          [ "$rc" = 0 ] || exit 1
          # latest only follows the highest version, so old releases and hotfixes do not move it back
          tags="-t $IMAGE:$TAG"
          rc=0
          sh script/is-newest-version.sh "$TAG" || rc=$?
          if [ "$rc" = 0 ]; then
            tags="$tags -t $IMAGE:latest"
          elif [ "$rc" = 1 ]; then
            echo "$TAG is not the newest version, keeping $IMAGE:latest"
          else
            exit 1
          fi
          docker buildx imagetools create $tags "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
