name: 🐧 Release on Linux arm64
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example 0.4.2"
        required: true
        type: string
    secrets:
      VIDMERGER_DOCKERHUB_SECRET:
        description: "Docker Hub access token for pushing the image"
        required: true
permissions:
  contents: write
jobs:
  build:
    name: 🐧 Build and upload Linux arm64 asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: ⬇️ Install arm64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu

      - name: 🧑‍🔧 Build Release arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          tar -C target/aarch64-unknown-linux-gnu/release -czf target/aarch64-unknown-linux-gnu/release/vidmerger-linux-arm64.tar.gz vidmerger

      - name: 🚀 Upload arm64 Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          asset=vidmerger-linux-arm64.tar.gz
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
            echo "$asset already on release, reusing it"
          else
            gh release upload "$TAG" "target/aarch64-unknown-linux-gnu/release/$asset"
          fi

  docker:
    name: 🐳 Build and push Docker image for arm64
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$TAG" = "buildcache" ]; then
            echo "The buildcache tag is reserved for the Docker build cache" >&2
            exit 1
          fi

      - name: Check if this arch is already on Docker Hub
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${{ github.repository }}/tags/$TAG-arm64")
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG-arm64 is already on Docker Hub, skipping build and push"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v4
        env:
          # https://app.docker.com/accounts/tgotwig/settings/personal-access-tokens
          DOCKERHUB_SECRET: ${{ secrets.VIDMERGER_DOCKERHUB_SECRET }}
        with:
          username: tgotwig
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: Build and push Docker image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ github.repository }}:${{ inputs.tag }}-arm64
          platforms: linux/arm64
          cache-from: type=registry,ref=${{ github.repository }}:buildcache-arm64
          cache-to: type=registry,ref=${{ github.repository }}:buildcache-arm64,mode=max,ignore-error=true
          provenance: false
