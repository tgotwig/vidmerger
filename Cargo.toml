[package]
authors = ["tgotwig <thomas@tgotwig.dev>"]
edition = "2021"
name = "vidmerger"
version = "0.4.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dependencies]
clap = {version = "4.0.0", features = ["derive"]}
crossterm = "0.29"
lazy_static = "1.5.0"
nanoid = "0.5.0"
path-slash = "0.2.0"
regex = "1"
system_shutdown = "4.0.0"
term-painter = "0.4.0"
which = "8.0.0"

[dev-dependencies]
assert_cmd = "2.0.12"
ctor = "1.0.0"
k9 = "0.12.0"
stdext = "0.3.0"

[[test]]
name = "e2e"
path = "test/e2e.rs"

[[test]]
name = "e2e-mov"
path = "test/e2e-mov.rs"

[[test]]
name = "e2e-mp3"
path = "test/e2e-mp3.rs"

[[test]]
name = "e2e-mp4"
path = "test/e2e-mp4.rs"
