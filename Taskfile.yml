version: "3"
tasks:
  default:
    deps: [install, test]
  install:
    cmds:
      - |
        rustup component add clippy
        rustup component add rustfmt

  run: cargo run -- {{.CLI_ARGS | default "data/call_merger"}} -y
  run-docker:
    - |
      docker build -t vidmerger .
      docker container run -it --rm -v ./data/call_merger:/data vidmerger
  test: cargo test
  count-tests: ./script/count-tests.sh
  lint: cargo clippy
