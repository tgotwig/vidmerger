version: "3"
tasks:
  default:
    deps: [install, test]
  install:
    cmds:
      - |
        rustup component add clippy
        rustup component add rustfmt

  run: cargo run -- {{.CLI_ARGS | default "data/call_merger"}} -y
  run-docker:
    - |
      docker container run --rm -v .:/app -v vidmerger-cargo:/usr/local/cargo/registry -w /app rust:1.100.0 cargo build --release --target-dir target/docker
      docker build -f docker/Dockerfile -t vidmerger target/docker/release
      docker container run -it --rm -v ./data/call_merger:/data vidmerger
  test: cargo test && task count-tests
  count-tests: sh ./script/count-tests.sh
  lint: cargo clippy
